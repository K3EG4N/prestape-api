name: Despliegue a producción

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: prestape-api
  APP_URL: https://prestape-api-fmaybdhtc9e3ajdb.brazilsouth-01.azurewebsites.net
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn clean package
        run: mvn -B clean package -DskipTests -Drevision=${{ env.VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: prestape-api-${{ env.VERSION }}
          path: target/prestape-api-${{ env.VERSION }}.jar
          if-no-files-found: error

  qa:
    name: Pruebas / QA
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn test
        run: mvn -B test

  release:
    name: Liberación
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prestape-api-${{ env.VERSION }}

      - name: Crear GitHub Release v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" "prestape-api-${VERSION}.jar" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v${VERSION}" \
            --generate-notes

  deploy:
    name: Producción
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.APP_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prestape-api-${{ env.VERSION }}

      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: prestape-api-${{ env.VERSION }}.jar

      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            health=$(curl -s "${APP_URL}/actuator/health" || true)
            version=$(curl -s "${APP_URL}/actuator/info" | jq -r '.build.version // empty' || true)
            echo "Intento ${attempt}: health=${health} version=${version}"
            if [ "$(echo "$health" | jq -r '.status // empty' 2>/dev/null)" = "UP" ] && [ "$version" = "$VERSION" ]; then
              echo "Versión ${VERSION} en producción y saludable"
              exit 0
            fi
            sleep 10
          done
          echo "La aplicación no respondió UP con la versión ${VERSION}"
          exit 1
