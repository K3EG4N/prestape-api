spring.application.name=prestape-api
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Prestape}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

spring.jackson.mapper.accept-case-insensitive-enums=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.timezone=${APP_TIMEZONE:America/Lima}
app.report.timezone=${APP_TIMEZONE:America/Lima}
app.report.max-rows=${REPORT_MAX_ROWS:10000}

logging.file.path=${LOG_PATH:logs}
logging.level.com.prestape=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.git.mode=simple
